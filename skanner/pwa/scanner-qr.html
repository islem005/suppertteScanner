<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0c0c0d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="SKANER by ivond — instant barcode scanning.">
  <meta property="og:title" content="SKANER by ivond">
  <meta property="og:description" content="SKANER by ivond — instant barcode scanning.">
  <title>SKANER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/css/tokens.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg-base); color: var(--text-primary); font-family: var(--font-sans); text-align: center; padding: var(--space-6); }
    .qr-wrap { max-width: 360px; }
    .qr-wrap h1 { font-size: var(--text-2xl); margin-bottom: var(--space-2); }
    .qr-wrap p { color: var(--text-secondary); font-size: var(--text-sm); margin-bottom: var(--space-6); line-height: 1.5; }
    .qr-code { display: block; margin: 0 auto var(--space-4); width: 200px; height: 200px; border-radius: var(--radius-lg); border: 1px solid var(--border-default); }
    .btn { display: inline-flex; align-items: center; gap: var(--space-2); padding: var(--space-3) var(--space-6); background: var(--color-primary); color: var(--color-primary-text); border: none; border-radius: var(--radius-md); font-size: var(--text-sm); font-weight: 600; cursor: pointer; text-decoration: none; transition: background var(--transition-fast); }
    .btn:hover { background: var(--color-primary-hover); }
    .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); background: var(--bg-elevated); color: var(--text-primary); padding: var(--space-3) var(--space-5); border-radius: var(--radius-lg); font-size: var(--text-sm); border: 1px solid var(--border-default); box-shadow: var(--shadow-md); opacity: 0; transition: opacity var(--transition-base); pointer-events: none; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="qr-wrap">
    <h1>SKANER</h1>
    <p>Open this page on your phone to scan barcodes with your camera.</p>
    <img id="qr-code" class="qr-code" alt="QR Code" />
    <a id="direct-link" class="btn" href="#" target="_blank" rel="noopener">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      Open Store
    </a>
  </div>
  <div id="toast" class="toast"></div>
  <script>
    var host = location.hostname;
    var storeSlug = host.split('.')[0];
    var apiBase = '/api';

    fetch(apiBase + '/stores/slug/' + encodeURIComponent(storeSlug))
      .then(function(r) { return r.json(); })
      .then(function(store) {
        var storeUrl = 'https://' + host + '/';
        document.title = store.name + ' — SKANER';
        document.querySelector('h1').textContent = store.name;
        document.getElementById('direct-link').href = storeUrl;

        return fetch(apiBase + '/branding/' + store.id);
      })
      .then(function(r) { return r.json(); })
      .then(function(branding) {
        if (branding && branding.primary_color) {
          document.querySelector('meta[name="theme-color"]').content = branding.primary_color;
        }
      })
      .catch(function() { /* silent */ });

    var qrImg = document.getElementById('qr-code');
    qrImg.src = '/api/files/qr/' + encodeURIComponent(storeSlug) + '.svg';
    qrImg.onerror = function() {
      qrImg.style.display = 'none';
      var toast = document.getElementById('toast');
      toast.textContent = 'Could not load QR code';
      toast.classList.add('show');
      setTimeout(function() { toast.classList.remove('show'); }, 3000);
    };
  </script>
</body>
</html>
