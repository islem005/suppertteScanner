<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ivond — Building digital products. SKANER: barcode scanning for stores.">
  <meta property="og:title" content="ivond">
  <meta property="og:description" content="Building digital products.">
  <meta property="og:url" content="https://ivond.com">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#0a0a0b">
  <title>ivond</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/home/css/portfolio.css">
</head>
<body>

  <div id="canvas-container"></div>

  <section id="hero" data-animate>
    <div class="hero-brand" data-animate-child>
      ivond<span>.</span>
    </div>
    <p class="hero-tagline" data-animate-child>Building digital products</p>
  </section>

  <section id="products" data-animate>
    <p class="products-title" data-animate-child>Products</p>
    <div class="product-grid">
      <a href="https://skanner.ivond.com" class="product-card" data-animate-child>
        <div class="product-card-mockup">
          <div class="mockup-body">
            <div class="mockup-notch"></div>
            <div class="mockup-screen">
              <div class="mockup-barcode"></div>
              <div class="mockup-line"></div>
              <div class="mockup-result">
                <span class="mockup-name">Lait</span>
                <span class="mockup-price">100 DZD</span>
              </div>
            </div>
          </div>
        </div>
        <div class="product-card-info">
          <div class="product-card-name">SKANER</div>
          <div class="product-card-desc">Barcode scanning for stores. Customers scan with their phone — prices appear instantly.</div>
          <div class="product-card-arrow">
            Visit SKANER
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
            </svg>
          </div>
        </div>
      </a>
    </div>
  </section>

  <footer id="footer" data-animate>
    <div class="container footer-inner">
      <div class="footer-brand">ivond</div>
      <div class="footer-copy">&copy; 2026 ivond</div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="/home/js/portfolio.js"></script>
</body>
</html>
