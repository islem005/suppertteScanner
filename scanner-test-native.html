<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0c0c0d">
<title>Test — Native BarcodeDetector</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f0f1a;--card:#1a1a2e;--border:#2a2a3e;--text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;--green:#22c55e;--red:#ef4444;--blue:#3b82f6;--purple:#8b5cf6}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);height:100dvh;overflow:hidden;display:flex;flex-direction:column}
.top-bar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--border)}
.top-bar h1{font-size:15px;font-weight:600}
.top-bar .badge{font-size:10px;padding:2px 8px;border-radius:4px;background:var(--green);color:#000;font-weight:700}
.top-bar .badge.unsupported{background:var(--red)}
.video-wrap{flex:1;position:relative;background:#000;overflow:hidden;display:none}
.video-wrap video{width:100%;height:100%;object-fit:cover}
.video-wrap .overlay{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;justify-content:center;align-items:center;pointer-events:none}
.video-wrap .overlay .hint{color:#fff;font-size:14px;font-weight:600;text-shadow:0 2px 8px rgba(0,0,0,.8);background:rgba(0,0,0,.5);padding:6px 16px;border-radius:8px}
.video-wrap .overlay .result{color:#22c55e;font-size:18px;font-weight:700;text-shadow:0 2px 8px rgba(0,0,0,.8);background:rgba(0,0,0,.6);padding:8px 20px;border-radius:12px;margin-top:8px;display:none}
.video-wrap .overlay .fps{position:absolute;bottom:8px;right:8px;color:rgba(255,255,255,.5);font-size:10px;font-family:monospace}
.placeholder{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text3);gap:8px;padding:20px}
.placeholder .icon{font-size:48px;opacity:.3}
.controls{flex:0 0 auto;display:flex;gap:8px;padding:8px 12px;background:var(--card);border-top:1px solid var(--border);flex-wrap:wrap}
.btn{padding:10px 20px;border:0;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;color:#fff;flex:1;min-width:80px;text-align:center}
.btn:disabled{opacity:.4;cursor:default}
.btn.green{background:var(--green)}.btn.red{background:var(--red)}.btn.blue{background:var(--blue)}.btn.purple{background:var(--purple)}
.btn.outline{background:transparent;border:1px solid var(--border);color:var(--text2)}
.panel{flex:0 0 auto;background:var(--card);border-top:1px solid var(--border);padding:8px 12px;font-size:12px;font-family:monospace;line-height:1.6;max-height:120px;overflow-y:auto}
.panel .label{color:var(--text2)}.panel .val{word-break:break-all}
.error{color:var(--red)}.ok{color:var(--green)}
#error-box{display:none;padding:6px 10px;background:#3b0000;border:1px solid var(--red);border-radius:4px;color:#ff8a8a;font-size:11px;font-family:monospace;white-space:pre-wrap;margin-bottom:4px;max-height:60px;overflow-y:auto}
#cv-wrap{display:none;background:#000;border-bottom:1px solid var(--border)}
#cv-wrap canvas{width:100%;display:block;max-height:120px}
.back-link{color:var(--text3);text-decoration:none;font-size:12px;margin-right:auto}
.back-link:hover{color:var(--text)}
</style>
</head>
<body>

<div class="top-bar">
  <a href="/scanner-test" class="back-link">&larr; Back</a>
  <h1>Native BarcodeDetector</h1>
  <span class="badge" id="support-badge">checking...</span>
</div>

<div class="placeholder" id="placeholder">
  <div class="icon">&#128247;</div>
  <div>Press Start to begin scanning</div>
</div>

<div class="video-wrap" id="video-wrap">
  <video id="video" autoplay playsinline muted></video>
  <div class="overlay">
    <div class="hint" id="hint">Point camera at barcode</div>
    <div class="result" id="result-text"></div>
    <div class="fps" id="fps-display"></div>
  </div>
</div>

<div id="cv-wrap">
  <canvas id="scan-canvas"></canvas>
</div>

<div class="controls">
  <button id="btn-start" class="btn green">Start</button>
  <button id="btn-stop" class="btn red" disabled>Stop</button>
  <button id="btn-self" class="btn purple">Draw &amp; Detect</button>
</div>

<div class="panel">
  <div id="error-box"></div>
  <div id="r-result">Ready.</div>
  <div id="d-info"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3/dist/JsBarcode.all.min.js"></script>
<script type="module">
const video = document.getElementById('video')
const btnStart = document.getElementById('btn-start')
const btnStop = document.getElementById('btn-stop')
const btnSelf = document.getElementById('btn-self')
const canvasEl = document.getElementById('scan-canvas')
const cvWrap = document.getElementById('cv-wrap')
const rResult = document.getElementById('r-result')
const dInfo = document.getElementById('d-info')
const errorBox = document.getElementById('error-box')
const hint = document.getElementById('hint')
const resultText = document.getElementById('result-text')
const fpsDisplay = document.getElementById('fps-display')
const videoWrap = document.getElementById('video-wrap')
const placeholder = document.getElementById('placeholder')
const supportBadge = document.getElementById('support-badge')

let stream = null, running = false, loopId = null, count = 0, totalTime = 0
const TARGET_FPS = 4
const FRAME_INTERVAL = 1000 / TARGET_FPS

function show(msg) { rResult.innerHTML = msg }
function info(msg) { dInfo.textContent = msg }

function showError(msg) {
  errorBox.style.display = 'block'
  errorBox.textContent += '\n[' + new Date().toLocaleTimeString() + '] ' + msg
  errorBox.scrollTop = errorBox.scrollHeight
  console.error(msg)
}
window.onerror = (_, _2, _3, _4, err) => showError('UNHANDLED: ' + (err?.message || err || 'unknown'))
window.addEventListener('unhandledrejection', e => showError('UNHANDLED PROMISE: ' + (e.reason?.message || e.reason || 'unknown')))

// ── Check native support ──
const IS_SUPPORTED = 'BarcodeDetector' in window
supportBadge.textContent = IS_SUPPORTED ? 'supported' : 'NOT supported'
supportBadge.className = 'badge' + (IS_SUPPORTED ? '' : ' unsupported')
if (!IS_SUPPORTED) showError('Native BarcodeDetector NOT available on this device')

let detector = null
if (IS_SUPPORTED) {
  try {
    detector = new BarcodeDetector({ formats: ['ean_13'] })
    show('<span class="ok">&#10003; Native BarcodeDetector initialized</span>')
  } catch (e) {
    showError('BarcodeDetector init: ' + e.message)
  }
}

async function detectFrame() {
  if (!detector || !running) return []
  return detector.detect(video)
}

async function scheduleDetect() {
  if (!running) return
  const startTime = performance.now()
  try {
    if (video.readyState >= 2) {
      const codes = await detectFrame()
      const elapsed = performance.now() - startTime
      count++
      totalTime += elapsed
      const avg = (totalTime / count).toFixed(1)
      fpsDisplay.textContent = `${elapsed.toFixed(0)}ms | avg ${avg}ms | ${codes.length} found`
      if (codes.length > 0) {
        const r = codes[0]
        const msg = '&#10003; <span class="label">Code:</span> <span class="val">' + esc(r.rawValue) + '</span> <span class="label">Format:</span> ' + esc(r.format) + ' <span class="label">(' + count + ' frames)</span>'
        show(msg)
        resultText.textContent = r.rawValue
        resultText.style.display = 'block'
        hint.textContent = 'Detected!'
        setTimeout(() => { hint.textContent = 'Point camera at barcode'; resultText.style.display = 'none' }, 2000)
      } else {
        info('Detected ' + count + ' frames | Avg ' + avg + 'ms | No code')
      }
    }
  } catch (e) {
    if (running) showError('SCAN: ' + (e.message || e))
  }
  if (!running) return
  const elapsed = performance.now() - startTime
  loopId = setTimeout(scheduleDetect, Math.max(0, FRAME_INTERVAL - elapsed))
}

async function startScanning() {
  if (stream) return
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
    video.srcObject = stream
    await video.play()
    placeholder.style.display = 'none'
    videoWrap.style.display = 'block'
    btnStart.disabled = true; btnStop.disabled = false
    running = true; count = 0; totalTime = 0
    show('<span class="ok">Scanning...</span>'); info('')
    scheduleDetect()
  } catch (e) {
    showError('CAMERA: ' + e.message)
    show('<span class="error">Camera failed: ' + e.message + '</span>')
  }
}

function stopScanning() {
  running = false
  if (loopId) { clearTimeout(loopId); loopId = null }
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null }
  video.srcObject = null
  videoWrap.style.display = 'none'
  placeholder.style.display = 'flex'
  btnStart.disabled = false; btnStop.disabled = true
  show('Stopped (' + count + ' frames)')
}

async function drawAndDetect() {
  show('Drawing test barcode...'); info('')
  canvasEl.width = 400; canvasEl.height = 200
  const ctx = canvasEl.getContext('2d')
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, 400, 200)
  try {
    JsBarcode(canvasEl, '1234567890128', { format: 'EAN13', width: 2, height: 100, displayValue: true, margin: 10 })
    cvWrap.style.display = 'block'
    if (!detector) {
      show('<span class="error">Native BarcodeDetector not available. Cannot detect.</span>')
      return
    }
    const startTime = performance.now()
    const codes = await detector.detect(canvasEl)
    const elapsed = performance.now() - startTime
    info('Canvas: 400x200 | Time: ' + elapsed.toFixed(1) + 'ms | Results: ' + codes.length)
    if (codes.length > 0) {
      const r = codes[0]
      show('&#10003; <span class="label">Code:</span> <span class="val">' + esc(r.rawValue) + '</span><br><span class="label">Format:</span> ' + esc(r.format) + ' <span class="label">(' + elapsed.toFixed(1) + 'ms)</span>')
    } else {
      show('<span class="error">&#10007; Self-test failed! No barcode detected</span>')
    }
  } catch (e) {
    showError('SELFTEST: ' + (e.message || e))
    show('<span class="error">Error: ' + e.message + '</span>')
  }
}

function esc(s) { return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])) }

btnStart.onclick = startScanning
btnStop.onclick = stopScanning
btnSelf.onclick = drawAndDetect
</script>
</body>
</html>
